# githubHosts.cfg --- gitist github access profiles (TEMPLATE; no real secrets).
#
# Read by gitist's own configparser reader. Structurally consistent with
# gitlabHosts.cfg: a [global] section names the default tag, and one [section]
# per github account selects a PAT. The plant selects which with:
#     cntrlInfo.serverConfigTag = "<section>"     (or leave unset to use [global] default)
# Copy to your serverConfigPath (e.g. ~/githubHosts.cfg), fill in real tokens,
# chmod 600, and keep the filled-in copy OUT of version control.
#
# Keys: url   --- omit / api.github.com for public; https://HOST/api/v3 for Enterprise
#       token --- a github PAT; leave empty for anonymous (public-only) access

[global]
  default = default

[default]
  url = https://api.github.com
  token =

[mohsen]
  url = https://api.github.com
  token = ghp_REPLACE_WITH_YOUR_PAT

[work-enterprise]
  url = https://github.example.com/api/v3
  token = ghp_REPLACE_WITH_ENTERPRISE_PAT
