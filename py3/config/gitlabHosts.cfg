# gitlabHosts.cfg --- gitist gitlab access profiles (TEMPLATE; no real secrets).
#
# python-gitlab native format (read by gitlab.Gitlab.from_config). One [section]
# per gitlab account; the plant selects which with:
#     cntrlInfo.serverConfigTag = "<section>"     (or leave unset to use [global] default)
# Copy to your serverConfigPath (e.g. ~/gitlabHosts.cfg), fill in real tokens,
# chmod 600, and keep the filled-in copy OUT of version control.

[global]
  default = default
  ssl_verify = true
  timeout = 5

[default]
  url = https://gitlab.com
  private_token = glpat-REPLACE_WITH_YOUR_PAT
  api_version = 4

[mohsen]
  url = https://gitlab.com
  private_token = glpat-REPLACE_WITH_YOUR_PAT
  api_version = 4
